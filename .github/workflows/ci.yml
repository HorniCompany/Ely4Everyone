name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # 21 compiles the 1.21.x mod, 25 runs Gradle (Loom 1.15+) and 26.x.
      - name: Set up Temurin 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run build and tests
        run: ./gradlew --no-daemon build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ely4everyone-build-artifacts
          path: |
            mod/versions/*/build/libs/*.jar
          if-no-files-found: error

  # The real game on every Minecraft version (mod/src/gametest/.../ElyClientGameTest.kt), on a
  # virtual display with software OpenGL. Screenshots are kept as artifacts to look at.
  game-tests:
    name: Game tests (${{ matrix.minecraft }})
    runs-on: ubuntu-24.04
    # A game that cannot open its window waits forever instead of crashing.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.21.11", "26.1.2", "26.2", "26.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin 21 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils

      - name: Check the virtual display
        run: xvfb-run -a -s "-screen 0 1920x1080x24" glxinfo -B | head -20

      - name: Run the game tests
        env:
          # Mesa software rendering. 26.3 opens its window with SDL3, which found no usable GLX
          # visual under Xvfb; EGL works there.
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEO_FORCE_EGL: "1"
        run: |
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew --no-daemon :mod:${{ matrix.minecraft }}:runClientGameTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-test-screenshots-${{ matrix.minecraft }}
          path: mod/versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots
          if-no-files-found: warn

      - name: Upload game logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: game-test-logs-${{ matrix.minecraft }}
          path: |
            mod/versions/${{ matrix.minecraft }}/build/run/clientGameTest/logs
            mod/versions/${{ matrix.minecraft }}/build/run/clientGameTest/crash-reports
          if-no-files-found: warn
